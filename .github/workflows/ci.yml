name: CI

on:
  push:
  pull_request:

jobs:
  repo-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the acceptance checker
        run: python -m unittest discover -s .claude/skills/repo-acceptance/tests -v
